[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-relay"
version = "0.1.0"
description = "Bring-your-own-key generation relay and private memory client for Recall"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Recall contributors"}]
keywords = ["generative-media", "gemini", "backblaze", "b2", "genblaze", "semantic-cache"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.scripts]
recall-relay = "recall_relay_cli:main"

[tool.setuptools]
py-modules = ["recall_relay", "recall_relay_cli"]
