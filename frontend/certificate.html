<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall proof certificate</title><style>body{margin:0;background:#0b0d15;color:#f6f7ff;font:16px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:48px 24px}.brand{color:#9c8cff;font-weight:900;font-size:24px}.eyebrow{color:#87ebc1;font-size:12px;letter-spacing:1.3px;font-weight:800;margin-top:42px}h1{font-size:clamp(32px,6vw,58px);letter-spacing:-2px;margin:12px 0}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:#141a2a;border:1px solid #2a344b;border-radius:16px;padding:20px}.asset{width:100%;border-radius:12px;background:#1b2336;min-height:220px;display:flex;align-items:center;justify-content:center}.asset img,.asset video{display:block;width:100%;border-radius:12px}.asset audio{width:calc(100% - 32px)}.ok{color:#87ebc1;font-weight:800}.muted{color:#9ca7bf;line-height:1.55}code{word-break:break-all;color:#c9c5ff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="brand" href="/">recall</a><div class="eyebrow">VERIFIABLE GENERATION RECORD</div><h1 id="title">Loading certificate...</h1><div class="grid"><section class="card"><div id="asset" class="asset" aria-label="Generated media preview"></div><p class="muted" id="prompt"></p></section><section class="card"><p><span class="muted">B2 asset hash</span><br><strong id="assetStatus"></strong></p><p><span class="muted">Genblaze manifest</span><br><strong id="manifestStatus"></strong></p><p><span class="muted">Canonical hash</span><br><code id="canonical"></code></p><p><span class="muted">Lineage</span><br><span id="lineage"></span></p><p><span class="muted">Economics</span><br><span id="economics"></span></p></section></div></main><script>
const id=encodeURIComponent(location.pathname.split('/').pop()),$=x=>document.getElementById(x),money=x=>x==null?'Unavailable':'$'+Number(x).toFixed(2);
async function api(path){const response=await fetch(path);const data=await response.json().catch(()=>({detail:'Invalid response'}));if(!response.ok)throw Error(data.detail||`HTTP ${response.status}`);return data}
function renderAsset(g){const container=$('asset'),element=document.createElement(g.modality==='video'?'video':g.modality==='audio'?'audio':'img');element.src=g.asset_url;element.setAttribute('aria-label',`Generated ${g.modality||'media'} for ${g.prompt}`);if(g.modality==='video'||g.modality==='audio'){element.controls=true;element.preload='metadata'}else{element.alt=`Generated asset for ${g.prompt}`;element.loading='lazy'}container.replaceChildren(element)}
Promise.all([api('/api/v1/gen/'+id),api('/api/v1/gen/'+id+'/verify'),api('/api/v1/gen/'+id+'/lineage'),api('/api/v1/savings')]).then(([g,v,l,s])=>{$('title').textContent='Proof for '+g.gen_id;renderAsset(g);$('prompt').textContent=g.prompt;$('assetStatus').textContent=v.asset_hash_matches?'Verified against B2':'Attention required';$('assetStatus').className=v.asset_hash_matches?'ok':'';const external=v.status==='externally_captured_asset_verified';$('manifestStatus').textContent=v.manifest_verified?'Canonical Genblaze manifest verified':external?'External capture record verified':'Attention required';$('manifestStatus').className=v.manifest_verified||external?'ok':'';$('canonical').textContent=v.canonical_manifest_hash||'Not applicable';$('lineage').textContent=[...(l.ancestors||[]).map(x=>x.gen_id),g.gen_id,...(l.children||[]).map(x=>x.gen_id)].join(' -> ');$('economics').textContent='Generation cost '+money(g.cost_usd)+' | avoided '+money((s.savings_by_asset||{})[g.gen_id]||0)}).catch(error=>{$('title').textContent='Certificate unavailable';$('prompt').textContent=error.message})
</script></body></html>
